name: Keep Render Backend Awake

on:
  schedule:
    # Runs every 14 minutes
    - cron: '*/14 * * * *'
  # Allows you to run this workflow manually from the Actions tab if needed
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Portfolio API
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://portfolio-backend-dvyu.onrender.com/api/projects/